# ─────────────────────────────────────────────────────────────────────
#  지금은 쓰이지 않는 템플릿입니다.
#
#  이 사이트는 AWS Amplify Hosting 으로 운영합니다. 배포 방법과 현재
#  구성은 deploy/README.md 를 보세요. 이 스택은 배포되어 있지 않습니다.
#
#  남겨둔 이유: Amplify 무료 한도가 끝난 뒤 전송 비용이 문제가 되면
#  S3 + CloudFront 로 옮기는 선택지가 있고, CloudFront 무료 한도는
#  기간 제한이 없습니다. 그때 쓸 수 있게 보관합니다.
#
#  주의: 이 템플릿은 AWS 로 검증한 적이 없습니다. 쓰기 전에
#    aws cloudformation validate-template --template-body file://deploy/cloudformation.yaml
#  를 먼저 돌려보세요. 그리고 이 구성으로 옮기면 인증서를 us-east-1 에
#  직접 발급하고 DNS 도 새 배포판으로 다시 걸어야 합니다.
# ─────────────────────────────────────────────────────────────────────
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  m4ch77.com — 정적 사이트 호스팅 (비공개 S3 + CloudFront). 현재 미사용.
  버킷은 외부에 열지 않고 CloudFront만 읽게 둡니다(OAC).
  열어야 할 포트도, 관리할 서버도 없습니다.

Parameters:
  ProjectName:
    Type: String
    Default: m4ch77
    Description: 리소스 이름에 붙는 접두어

  DomainName:
    Type: String
    Default: ""
    Description: >
      쓸 도메인 (예: m4ch77.com). 비워 두면 CloudFront 기본 도메인으로만 뜹니다.
      나중에 인증서를 발급한 뒤 이 스택을 업데이트해도 됩니다.

  IncludeWww:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: www 하위 도메인도 같은 사이트로 받을지

  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ACM 인증서 ARN. CloudFront용은 반드시 us-east-1 에서 발급해야 합니다.
      DomainName 을 쓸 때만 필요합니다.

  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: >
      200 이면 서울 엣지가 포함됩니다. 100 은 북미·유럽만이라 더 싸지만
      국내 방문자 지연이 커집니다. 무료 한도 안에서는 요금 차이가 없습니다.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  HasWww: !And
    - !Condition HasDomain
    - !Equals [!Ref IncludeWww, "true"]

Resources:
  # ── 원본 버킷 ─────────────────────────────────────────
  # 퍼블릭 접근을 전부 막습니다. 정적 웹사이트 호스팅 기능도 쓰지 않습니다.
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-site-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # ── CloudFront 가 버킷을 읽는 방법 (OAC) ──────────────
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${ProjectName}-oac"
        Description: CloudFront only access to the site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${ProjectName} static site"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html

        Aliases: !If
          - HasDomain
          - !If
            - HasWww
            - [!Ref DomainName, !Sub "www.${DomainName}"]
            - [!Ref DomainName]
          - !Ref AWS::NoValue

        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        Origins:
          - Id: SiteOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""

        DefaultCacheBehavior:
          TargetOriginId: SiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # 관리형 정책 CachingOptimized — 캐시 판단은 S3 가 보낸
          # Cache-Control 헤더를 따릅니다 (deploy.sh 가 지정합니다).
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # 관리형 정책 SecurityHeadersPolicy — HSTS, X-Content-Type-Options 등
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

        # 없는 경로는 첫 화면으로 보냅니다. 상태 코드는 정직하게 404 로 둡니다.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60

  # 이 배포판만 버킷을 읽을 수 있게 합니다.
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Description: deploy.sh 에 넣을 버킷 이름
    Value: !Ref SiteBucket

  DistributionId:
    Description: deploy.sh 에 넣을 배포판 ID
    Value: !Ref Distribution

  DistributionDomainName:
    Description: 도메인을 붙이기 전까지 접속할 주소
    Value: !GetAtt Distribution.DomainName

  DnsTarget:
    Description: 도메인의 A/AAAA(별칭) 또는 CNAME 이 가리켜야 할 곳
    Value: !GetAtt Distribution.DomainName
