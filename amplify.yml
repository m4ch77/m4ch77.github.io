# ============================================================
# AWS Amplify Hosting 빌드 설정
#
# Amplify 를 이 저장소에 연결하면, 푸시할 때마다 Amplify 가 이 파일을 읽고
# 스스로 빌드해서 배포합니다.
#
# 명령을 **한 줄씩만** 두는 것이 중요합니다. 여러 줄 스크립트를 여기 직접
# 쓰면 Amplify 콘솔이 그것을 한 줄 입력칸에 밀어 넣으면서 일부만 남기고
# 뭉개는 일이 있습니다(실제로 겪었습니다). 실제 로직은
# deploy/assemble.sh 에 있고, 세 배포 경로가 그 파일 하나를 같이 씁니다.
# ============================================================

version: 1

frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm ci
    build:
      commands:
        # 빌드 + _site 조립 + 비밀 값 검사를 한 번에 합니다.
        - bash deploy/assemble.sh

  artifacts:
    baseDirectory: _site
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
