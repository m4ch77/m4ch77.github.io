# ============================================================
# AWS Amplify Hosting 빌드 설정
#
# Amplify 를 이 저장소에 연결하면, 푸시할 때마다 Amplify 가 이 파일을 읽고
# 스스로 빌드해서 배포합니다. `./deploy/deploy.sh` 를 손으로 돌리지 않아도
# 됩니다.
#
# 산출물은 _site/ 하나로 모읍니다. GitHub Actions 워크플로와 **같은 허용
# 목록**을 씁니다. 두 경로가 어긋나면 한쪽에서만 보이는 파일이 생깁니다.
# ============================================================

version: 1

frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm ci

    build:
      commands:
        # 1) 마크다운 → HTML (수식·코드 강조까지 여기서 끝냅니다)
        - npm run build

        # 2) 올릴 것만 _site 로 모읍니다 (허용 목록)
        #    content/ · build/ · deploy/ · secret/ 은 목록에 없으므로
        #    구조적으로 올라갈 수 없습니다.
        - |
          set -euo pipefail
          shopt -s nullglob
          rm -rf _site && mkdir -p _site

          for f in *.html *.css *.js *.svg *.txt *.webmanifest; do
            cp "$f" _site/
          done

          for d in assets .well-known writing; do
            [ -d "$d" ] && cp -R "$d" _site/
          done

          echo "── _site 파일 수: $(find _site -type f | wc -l | tr -d ' ')"

        # 3) 비밀 값이 섞였으면 여기서 멈춥니다.
        #    GitHub Actions 쪽과 같은 검사를 둡니다. 배포 경로가 둘이면
        #    검사도 둘 다 있어야 의미가 있습니다.
        - |
          set -euo pipefail
          fail=0

          if find _site -type f \( -name '*.pem' -o -name '*.key' \
               -o -name '*.p12' -o -name '*.pfx' -o -name '.env*' \) \
               -print | grep -q .; then
            echo "산출물에 키 파일이 있습니다."
            fail=1
          fi

          if grep -rIlE -- '-----BEGIN[ A-Z]*PRIVATE KEY-----' _site 2>/dev/null; then
            echo "산출물에 개인키 블록이 있습니다."
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1
          echo "통과: 비밀 값 없음"

  artifacts:
    baseDirectory: _site
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
