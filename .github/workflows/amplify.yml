name: Deploy to Amplify (m4ch77.com)

# m4ch77.com 은 Amplify 에 올라갑니다. 이 앱은 **Git 저장소가 연결되어
# 있지 않은** 수동 배포 앱입니다(확인: get-app → repository: None).
# 그래서 Amplify 가 푸시를 감지하지 못합니다.
#
# 여기서는 반대로 합니다. GitHub Actions 가 빌드해서 zip 을 Amplify 로
# 올립니다. 그러면 Amplify 앱을 다시 만들거나 도메인을 옮기지 않고도
# 푸시할 때마다 자동 배포가 됩니다. 빌드는 공개 저장소라 무료이고,
# Amplify 빌드 시간(과금 대상)도 쓰지 않습니다.
#
# 자격증명이 없으면 아무 것도 하지 않고 조용히 끝납니다. 시크릿을 넣기
# 전까지 실패 메일이 오지 않게 하려는 것입니다.
#   필요한 시크릿: AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY
#   권한은 deploy/iam-policy.json 만큼만 주세요 (root 키를 쓰지 마세요).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# 같은 시각에 두 배포가 겹치면 Amplify 가 거부합니다. 하나씩 보냅니다.
concurrency:
  group: "amplify"
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ID: d2szwegb9si7cs
  BRANCH: main
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    name: 빌드 후 Amplify 로
    runs-on: ubuntu-latest
    steps:
      - name: 자격증명 있는지 확인
        id: guard
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS 시크릿이 없어 Amplify 배포를 건너뜁니다. deploy/iam-policy.json 을 보세요."
          fi

      - name: 체크아웃
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@v7

      - name: Node 준비
        if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 설치
        if: steps.guard.outputs.ok == 'true'
        run: npm ci

      - name: 빌드 · 산출물 모으기 · 비밀 값 검사
        if: steps.guard.outputs.ok == 'true'
        # Pages 워크플로 · amplify.yml 과 같은 스크립트를 씁니다.
        run: bash deploy/assemble.sh

      - name: AWS 자격증명
        if: steps.guard.outputs.ok == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Amplify 로 올리기
        if: steps.guard.outputs.ok == 'true'
        run: |
          set -euo pipefail

          # zip 은 build 산출물의 **내용**을 담아야 합니다. 최상위 폴더째로
          # 압축하면 사이트 루트가 잡히지 않아 Access Denied 가 납니다.
          ( cd _site && zip -qr ../site.zip . )
          echo "zip $(stat -c%s site.zip 2>/dev/null || stat -f%z site.zip) bytes"

          # 앞선 배포가 끝나지 않았으면 기다립니다. 겹치면 Amplify 가 거부합니다.
          for i in $(seq 1 30); do
            pending=$(aws amplify list-jobs --app-id "$APP_ID" --branch-name "$BRANCH" \
              --max-results 1 --query 'jobSummaries[0].status' --output text)
            case "$pending" in
              PENDING|RUNNING|PROVISIONING) echo "  이전 배포($pending) 대기 $i"; sleep 10 ;;
              *) break ;;
            esac
          done

          out=$(aws amplify create-deployment --app-id "$APP_ID" --branch-name "$BRANCH")
          job=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["jobId"])')
          url=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["zipUploadUrl"])')

          curl -sSf -X PUT -H 'Content-Type: application/zip' \
            --upload-file site.zip "$url" > /dev/null
          echo "job $job 업로드 완료"

          aws amplify start-deployment --app-id "$APP_ID" --branch-name "$BRANCH" \
            --job-id "$job" > /dev/null

          # 끝날 때까지 지켜보고, 실패하면 이 단계도 실패시킵니다.
          for i in $(seq 1 60); do
            st=$(aws amplify get-job --app-id "$APP_ID" --branch-name "$BRANCH" \
              --job-id "$job" --query 'job.summary.status' --output text)
            echo "  $st"
            case "$st" in
              SUCCEED) echo "배포 완료 → https://m4ch77.com"; exit 0 ;;
              FAILED|CANCELLED) echo "::error::Amplify 배포가 $st 로 끝났습니다."; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::시간 안에 끝나지 않았습니다."
          exit 1
